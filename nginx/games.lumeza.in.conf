# games.lumeza.in Nginx Virtual Host
server {
    server_name games.lumeza.in;

    root /var/www/games.lumeza.in;
    index index.html;

    # Compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript application/wasm;

    # Performance & WebAssembly Security headers
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "credentialless" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Vice City Game Engine Proxy (Root player at /vicecity/)
    location ^~ /vicecity/ {
        proxy_pass http://127.0.0.1:7000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_hide_header Content-Security-Policy;
        proxy_hide_header X-Frame-Options;
        add_header Content-Security-Policy "frame-ancestors 'self' https://games.lumeza.in https://craftedsoul.netlify.app http://localhost:* http://127.0.0.1:*;" always;
        add_header Access-Control-Allow-Origin * always;

        # Do NOT force Cross-Origin-Opener-Policy on the iframe embedding
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Vice City Assets, Data & Audio Streams
    location ^~ /vcsky/ {
        proxy_pass http://127.0.0.1:7000/vcsky/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /vcbr/ {
        proxy_pass http://127.0.0.1:7000/vcbr/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    # Vice City Cloud Saves API
    location ^~ /saves/ {
        proxy_pass http://127.0.0.1:7000/saves/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
    }

    # Vice City Token API
    location ^~ /token/ {
        proxy_pass http://127.0.0.1:7000/token/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        add_header Access-Control-Allow-Origin * always;
    }

    location = /intro.mp4 {
        proxy_pass http://127.0.0.1:7000/intro.mp4;
        proxy_set_header Host $host;
    }

    # Isolated Native Game Directories (Strict 404 on missing assets, no fallback to index.html)
    location ^~ /retrox/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /mario/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /minecraft/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /mario64/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /gta3/ {
        try_files $uri $uri/ =404;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
    }

    location ^~ /quake/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /doom/ {
        try_files $uri $uri/ =404;
    }

    location ^~ /cs16/ {
        try_files $uri $uri/ =404;
    }

    # Portal Homepage and Static Games
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|wasm|data|pak|wad|zip|jsdos|bin|bsp)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    listen [::]:443 ssl ipv6only=on;
    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/games.lumeza.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/games.lumeza.in/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    if ($host = games.lumeza.in) {
        return 301 https://$host$request_uri;
    }

    listen 80;
    listen [::]:80;
    server_name games.lumeza.in;
    return 404;
}
